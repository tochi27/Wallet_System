services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      - ./apps/api/.env.development:/app/apps/api/.env.development
    command: npm run dev

  postgres:
    # The project's development database. Matches DATABASE_URL in apps/api/.env.example.
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wallet_db
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql (one folder per major version)
      - postgres18_data:/var/lib/postgresql
    # Lets `docker compose up --wait` (used by `npm run dev:api`) block until Postgres accepts connections
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres18_data:
  redis_data:
