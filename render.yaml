# Render Blueprint for the API. The database is Supabase and Redis is Redis Cloud (see DEPLOYMENT.md),
# so there is no Render database here.
services:
  - type: web
    name: purplewallet-api
    runtime: docker
    # Always state the plan: without it Render creates a paid Starter instance
    plan: free
    # Same region as the Supabase database
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    # CI deploys (through the deploy hook) only after the API and browser tests pass, so Render
    # doesn't also build on every push. No preDeployCommand: the image applies migrations on start.
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DIRECT_FUNDING_ENABLED
        value: "false"  # no direct credit/debit/reversal in production; money moves through Paystack
      # Render's free plan blocks outgoing SMTP, so email goes through the Gmail relay script over HTTPS
      - key: EMAIL_PROVIDER
        value: gmail-script
      # sync: false — Render asks for these when the Blueprint is created; they're never stored in Git
      - key: DATABASE_URL
        sync: false  # Supabase session pooler URL (apps/api/.env.production.local)
      - key: REDIS_URL
        sync: false  # Redis Cloud URL (apps/api/.env.production.local)
      - key: JWT_SECRET
        sync: false  # apps/api/.env.production.local
      - key: KYC_ENCRYPTION_KEY
        sync: false  # apps/api/.env.production.local — never change it once ID documents exist
      - key: GMAIL_USER
        sync: false  # the demo Gmail address (the relay sends from it)
      - key: GMAIL_SCRIPT_URL
        sync: false  # the relay's web app address, ending in /exec (DEPLOYMENT.md step 3)
      - key: GMAIL_SCRIPT_SECRET
        sync: false  # apps/api/.env.production.local; must match the script's RELAY_SECRET property
      - key: APP_URL
        sync: false  # the Netlify address, e.g. https://purplewallet.netlify.app
      - key: CORS_ORIGINS
        sync: false  # the same Netlify address
      - key: PAYSTACK_SECRET_KEY
        sync: false  # test key, sk_test_…
      - key: PAYSTACK_CALLBACK_URL
        sync: false  # <Netlify address>/deposit/callback
      - key: GEMINI_API_KEY
        sync: false  # optional: AI insights and the assistant
      - key: SUPPORT_EMAIL
        sync: false  # optional: defaults to GMAIL_USER
