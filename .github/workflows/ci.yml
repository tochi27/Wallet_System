name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'

  test-api:
    name: API — Type-check & Test
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Type check
        run: npx tsc --noEmit
        working-directory: apps/api

      - name: Run tests
        run: npm run test:api
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          JWT_SECRET: ci-test-secret-not-used-in-mocked-tests
          REDIS_URL: redis://localhost:6379

  # The web app against a real API, database and Redis, in a real browser. Runs when either app
  # changes, since the browser tests exercise both.
  test-web:
    name: Web — Lint, build & browser tests
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint:web

      - name: Type-check and build
        run: npm run build:web

      - name: Type-check browser tests
        run: npm run typecheck:e2e -w apps/web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # Starts its own API (port 4100) and web app (port 5174) against wallet_e2e and Redis db 1
      - name: Browser tests
        run: npm run test:e2e -w apps/web
        env:
          E2E_DATABASE_URL: postgresql://postgres:password@localhost:5432/wallet_e2e
          E2E_REDIS_URL: redis://localhost:6379/1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  deploy-api:
    name: Deploy API to Render
    # Only when the browser tests pass too
    needs: [test-api, test-web]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy
        run: curl -f "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
