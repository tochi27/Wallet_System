# Netlify: the web app (apps/web). The API is hosted separately; see DEPLOYMENT.md.
# Set VITE_API_URL (and the VITE_DEMO_* values) under Site configuration → Environment variables:
# Vite bakes them into the build, so change them there, then redeploy.

[build]
  # From the repo root: Netlify installs dependencies itself (npm ci, from the shared workspace
  # lockfile) before running the command
  base = ""
  command = "npm run build:web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24"

# A single-page app: every path is served index.html, and React Router shows the right page.
# Without this, refreshing /settings or opening an emailed /verify-email link gives a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Camera and microphone stay off; the ID upload uses the file picker, which offers the camera itself
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Hashed build files never change, so browsers can keep them for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
